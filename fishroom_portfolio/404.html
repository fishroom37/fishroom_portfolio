<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>페이지를 찾을 수 없습니다</title>
  <link rel="apple-touch-icon" href="/favicon.png" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: Pretendard, "Malgun Gothic", sans-serif;
      background: #f6f7f9; color: #101828; min-height: 100vh;
      display: flex; align-items: center; justify-content: center; text-align: center; padding: 24px;
    }
    .box h1 { font-size: 88px; font-weight: 800; color: #2563eb; letter-spacing: -2px; }
    .box p { margin: 12px 0 28px; color: #475467; }
    .box a {
      display: inline-block; padding: 12px 26px; border-radius: 12px;
      background: #2563eb; color: #fff; font-weight: 600; text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>404</h1>
    <p>요청하신 페이지를 찾을 수 없습니다.</p>
    <a href="/">포트폴리오로 돌아가기</a>
  </div>
</body>
</html>
